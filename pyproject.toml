[project]
name = "mutation analysis - Smart study"
version = "0.1.0"
description = "SMART environment (converted from conda environment.yml)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- core scientific stack ---
    "numpy==2.2.5",
    "pandas==2.3.3",
    "bottleneck==1.4.2",
    "numexpr==2.14.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "tzdata==2025.2",

    # --- plotting ---
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "plotly==6.5.0",
    "kaleido==1.2.0",
    "narwhals==2.7.0",
    "pillow==12.0.0",

    # --- genomics (PyPI wheels bundle htslib) ---
    "cyvcf2==0.31.1",

    # --- CLI / logging / IO ---
    "click==8.3.1",
    "coloredlogs==15.0.1",
    "humanfriendly==10.0",
    "requests==2.31.0",
    "urllib3==1.26.8",
    "orjson==3.11.6",
    "simplejson==3.20.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-timeout==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart"]

[tool.pytest.ini_options]
timeout = 300
testpaths = ["tests"]
